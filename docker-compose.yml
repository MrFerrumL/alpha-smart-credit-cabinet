# Запуск всего решения одной командой:  docker compose up --build
# Кабинет: http://localhost:8080   API и Swagger: http://localhost:8000/api/docs
# Эмулятор внешних источников: http://localhost:8001/docs
# Воркер конвейера стартует сам и обрабатывает отправленные заявки.

name: alpha-credit

services:
  db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit}
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mocks:
    build: ./mocks
    environment:
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-400}
    ports:
      # Эмулятор с управлением сбоями (/admin/faults) — только с этой машины.
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-credit}:${POSTGRES_PASSWORD:-credit}@db:5432/${POSTGRES_DB:-credit}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string-in-production}
      MOCKS_URL: http://mocks:8001
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_ON_START: ${SEED_ON_START:-true}
      ENVIRONMENT: ${ENVIRONMENT:-demo}
      UPLOAD_DIR: /data/uploads
      # Пояснение решения (необязательно): backend отдаёт флаг и готовый текст, пишет текст воркер.
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct-q4_K_M}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      mocks:
        condition: service_healthy
    ports:
      # API и Swagger — только с этой машины; кабинет ходит в API через nginx.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # Фоновый конвейер: проверка → ЕГРЮЛ/ФНС/БКИ → оценка → решение.
  # Можно масштабировать: docker compose up --scale worker=3
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-credit}:${POSTGRES_PASSWORD:-credit}@db:5432/${POSTGRES_DB:-credit}
      MOCKS_URL: http://mocks:8001
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string-in-production}
      PIPELINE_STEP_DELAY_S: ${PIPELINE_STEP_DELAY_S:-1.5}
      SEED_ON_START: "false"
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
      # Пояснение решения: поток воркера ходит в OpenAI-совместимый API сервера модели; ключ — если сервер его требует.
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      LLM_API_KEY: ${LLM_API_KEY:-}
    # Воркер жив, если его цикл обновлял файл «пульса» в последнюю минуту (зависший шаг тоже будет виден).
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-heartbeat') < 60 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Необязательная локальная модель для пояснения решения: COMPOSE_PROFILES=llm и LLM_ENABLED=true.
  # Работает на процессоре; с видеокартой быстрее запустить Ollama на самом ПК (см. docs/llm.md).
  ollama:
    image: ollama/ollama:0.40.2
    profiles: ["llm"]
    init: true
    # При первом запуске скачивает модель; сервис здоров, когда модель загружена и отвечает.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rm -f /tmp/ready
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama show "$$LLM_MODEL" >/dev/null 2>&1 || ollama pull "$$LLM_MODEL"
        ollama run "$$LLM_MODEL" "ок" >/dev/null
        touch /tmp/ready
        wait
    environment:
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
    # Порт не публикуется: воркер ходит к модели по сети compose.
    volumes:
      - ollama:/root/.ollama
    # Модели 7B в Q4 нужно около 5 ГБ памяти.
    mem_limit: 7g
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 10s
      timeout: 3s
      start_period: 1800s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  # Модель профиля llm (около 4,7 ГБ); удаляется командой docker compose --profile llm down -v.
  ollama:
