# Журнал доступа — одна JSON-строка на запрос. request_id тот же, что уходит в backend заголовком X-Request-ID
# и стоит в его логах: по нему запрос находится в обоих журналах. $uri — без строки запроса, токенов в логе нет.
log_format json_access escape=json
  '{"ts":"$time_iso8601","request_id":"$request_id","method":"$request_method","uri":"$uri",'
  '"status":$status,"request_time":$request_time,"upstream_response_time":"$upstream_response_time"}';

# Вход по паролю — не чаще 30 в минуту с одного адреса (запас burst задан в location ниже).
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

# Политика контента для кабинета: собранный бандл без инлайн-скриптов и внешних источников.
# Swagger UI берёт скрипты с CDN и запускает инлайн-скрипт — для /api/docs и спецификации заголовок не отдаётся
# (пустое значение add_header nginx пропускает).
map $uri $csp {
  default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
  ~^/api/docs(/|$) "";
  /api/openapi.json "";
}

# Файлы бандла лежат под хешем в имени — их можно кэшировать навсегда. Значение задаётся через map, чтобы
# в location /assets/ не было своих add_header: они отменили бы все заголовки безопасности уровня server.
map $uri $assets_cache_control {
  ~^/assets/ "public, immutable";
  default "";
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;
  # В образе nginx этот файл — ссылка на stdout контейнера, строки видны в docker compose logs frontend.
  access_log /var/log/nginx/access.log json_access;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy $csp always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  # Без always: заголовок ставится только к успешным ответам, а не к 404 на несуществующий файл.
  add_header Cache-Control $assets_cache_control;

  # Общие настройки проксирования: location'ы наследуют их, пока не задают свои proxy_set_header.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Адрес клиента для счётчика неудачных входов в backend; присланное клиентом значение заменяется.
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Request-ID $request_id;

  # Вход по паролю: грубый предел на адрес. Порог с большим запасом: за 3 минуты один адрес в CI делает около
  # 20 входов, лимит — 30 в минуту и ещё 60 про запас. Подбор пароля к одной почте останавливает backend
  # (5 неудач за 5 минут для пары «почта + адрес»), а этот предел только отсекает поток запросов с одного адреса.
  location = /api/auth/login {
    limit_req zone=login burst=60 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @login_throttled;
    proxy_pass http://backend:8000;
  }

  # Ответ в формате ошибок API: кабинет показывает title и detail как есть.
  location @login_throttled {
    default_type "application/json; charset=utf-8";
    add_header Retry-After 60 always;
    add_header X-Content-Type-Options nosniff always;
    return 429 '{"status":429,"code":"too_many_requests","title":"Слишком много попыток входа","detail":"Подождите минуту и попробуйте снова."}';
  }

  location /api/ {
    proxy_pass http://backend:8000;
    # Живые статусы заявки идут потоком (SSE) — без буферизации.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /health/ {
    proxy_pass http://backend:8000;
  }

  location /assets/ {
    expires 1y;
  }

  location / {
    try_files $uri /index.html;
  }
}
