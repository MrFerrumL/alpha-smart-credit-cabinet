name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests on PostgreSQL, OpenAPI drift
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: credit
          POSTGRES_USER: credit
          POSTGRES_PASSWORD: credit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U credit -d credit"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://credit:credit@localhost:5432/credit
      TEST_DATABASE_URL: postgresql+psycopg://credit:credit@localhost:5432/credit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply on PostgreSQL and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (on the migrated PostgreSQL schema)
        run: python -m pytest -q
      - name: docs/openapi.json matches the code
        run: python -m scripts.export_openapi --check
      - name: State diagram in docs matches the code
        run: python -m scripts.export_state_diagram --check
      - name: Request collection matches the API
        run: python -m scripts.export_collection --check

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    name: Clean start from README, smoke, request collection and browser scenarios
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack exactly as README says (build, wait for healthchecks)
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Start memory sampler (docker stats in a loop, about every 2-4 s)
        run: |
          mkdir -p "$RUNNER_TEMP/resources"
          # The loop must outlive this step: output goes to a file, own session, no stdin.
          setsid nohup bash -c '
            echo $$ > "$1/sampler.pid"
            while true; do
              echo "# $(date +%s)"
              docker stats --no-stream --format "{{.Name}} {{.MemUsage}}"
              sleep 2
            done
          ' sampler "$RUNNER_TEMP/resources" > "$RUNNER_TEMP/resources/stats.log" 2>&1 < /dev/null &
      - name: Smoke test through nginx (demo login → application → approved)
        run: python3 scripts/smoke.py http://localhost:8080 --timeout 180
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install newman and Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Request collection end to end (newman)
        working-directory: e2e
        run: npm run api -- --env-var base_url=http://localhost:8080
      - name: Demo personas from README in the browser (Playwright)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_MOCKS_URL: http://localhost:8001
        run: npm run ui
      - name: Resources after the full run (peak memory, image sizes, disk)
        if: always()
        continue-on-error: true
        run: |
          dir="$RUNNER_TEMP/resources"
          mkdir -p "$dir"
          # The sampler runs under setsid: its pid is the process group id, so stop the whole group (loop, sleep, docker stats).
          if [ -f "$dir/sampler.pid" ]; then kill -- -"$(cat "$dir/sampler.pid")" 2>/dev/null || true; fi
          python3 scripts/resource_report.py --samples "$dir/stats.log" --out "$dir/resources.md" || echo "Resource report is not available"
          if [ -f "$dir/resources.md" ]; then cat "$dir/resources.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload resources
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: resources
          path: |
            ${{ runner.temp }}/resources/resources.md
            ${{ runner.temp }}/resources/stats.log
          if-no-files-found: warn
          retention-days: 30
      - name: Reset to a clean stand for the demo video (no rebuild)
        run: |
          docker compose down -v
          docker compose up -d --wait --wait-timeout 300
      - name: Install ffmpeg for the demo video
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
      - name: Record the main scenario as a video (Playwright)
        id: demo
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run demo
      - name: Convert the demo video to mp4 (required)
        if: always() && steps.demo.conclusion != 'skipped'
        run: |
          set -euo pipefail
          mkdir -p e2e/demo-video
          webm="$(find e2e/demo-results -name video.webm 2>/dev/null | head -n 1 || true)"
          if [ -z "$webm" ]; then
            echo "::error::No video was recorded"
            exit 1
          fi
          ffmpeg -y -loglevel error -i "$webm" -an -c:v libx264 -pix_fmt yuv420p -movflags +faststart e2e/demo-video/potok-demo.mp4
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 e2e/demo-video/potok-demo.mp4)"
          # About 2:30 expected; outside 120–200 s tune PACE in e2e/tests/demo/director.ts (fails after the summary).
          if awk -v d="$duration" 'BEGIN { exit !(d >= 120 && d <= 200) }'; then in_window=yes; else in_window=no; fi
          size="$(stat -c %s e2e/demo-video/potok-demo.mp4)"
          echo "potok-demo.mp4: duration ${duration} s (ffprobe), size ${size} bytes, within 120–200 s: ${in_window}"
          # Beats with captions and mouse presses of the recording, to tune the pace next to the video.
          for name in timeline.json presses.json; do
            file="$(find e2e/demo-results -name "$name" 2>/dev/null | head -n 1 || true)"
            if [ -n "$file" ]; then cp "$file" e2e/demo-video/; fi
          done
          ls -l e2e/demo-video
          {
            echo "## Видео основного сценария"
            echo
            echo "\`potok-demo.mp4\`: длительность ${duration} с (ffprobe), размер ${size} байт."
            if [ "$in_window" = yes ]; then
              echo "Длительность в допустимом окне 120–200 с."
            else
              echo "**Длительность вне допустимого окна 120–200 с** — темп записи нужно подправить (PACE в \`e2e/tests/demo/director.ts\`)."
            fi
            echo
            echo 'Артефакт `demo-video` в конце страницы прогона (Artifacts): видео, timeline.json и presses.json.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$in_window" != yes ]; then
            echo "::error::potok-demo.mp4 is ${duration} s long, outside the 120–200 s window: tune PACE in e2e/tests/demo/director.ts"
            exit 1
          fi
      - name: Upload demo video
        if: always() && steps.demo.conclusion != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: demo-video
          path: |
            e2e/demo-video/potok-demo.mp4
            e2e/demo-video/timeline.json
            e2e/demo-video/presses.json
          if-no-files-found: error
          retention-days: 30
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop and remove volumes
        if: always()
        run: docker compose down -v

  # The optional plain-language explanation, switched on, against the fake model in the source emulator. A separate
  # job: the job above keeps the feature off (the default) and its resource numbers stay clean.
  explanation:
    name: Explanation against a fake OpenAI-compatible model
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    env:
      # docker compose substitutes these into the backend and worker environment.
      LLM_ENABLED: "true"
      LLM_BASE_URL: http://mocks:8001/llm/v1
      LLM_MODEL: fake-explainer
      LLM_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack with the explanation on (build, wait for healthchecks)
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: The explanation flag is on in /api/meta
        run: |
          curl -fsS http://localhost:8080/api/meta | python3 -c '
          import json, sys
          sys.exit(0 if json.load(sys.stdin)["llm_explanation"] is True else "llm_explanation is not true in /api/meta")
          '
      - name: Smoke test through nginx (the main scenario works with the explanation on)
        run: python3 scripts/smoke.py http://localhost:8080 --timeout 180
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install newman and Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Request collection end to end (newman)
        working-directory: e2e
        run: npm run api -- --env-var base_url=http://localhost:8080
      - name: Explanation in the browser, normal and faulty model answers (Playwright)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_MOCKS_URL: http://localhost:8001
        run: npm run ui:llm
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-explanation
          path: |
            e2e/llm-report
            e2e/llm-results
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop and remove volumes
        if: always()
        run: docker compose down -v
