name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests on PostgreSQL, OpenAPI drift
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: credit
          POSTGRES_USER: credit
          POSTGRES_PASSWORD: credit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U credit -d credit"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://credit:credit@localhost:5432/credit
      TEST_DATABASE_URL: postgresql+psycopg://credit:credit@localhost:5432/credit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply on PostgreSQL and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (on the migrated PostgreSQL schema)
        run: python -m pytest -q
      - name: docs/openapi.json matches the code
        run: python -m scripts.export_openapi --check
      - name: State diagram in docs matches the code
        run: python -m scripts.export_state_diagram --check
      - name: Request collection matches the API
        run: python -m scripts.export_collection --check

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    name: Clean start from README, smoke, request collection and browser scenarios
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack exactly as README says (build, wait for healthchecks)
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Start memory sampler (docker stats every 2 s)
        run: |
          mkdir -p "$RUNNER_TEMP/resources"
          # The loop must outlive this step: output goes to a file, own session, no stdin.
          setsid nohup bash -c '
            echo $$ > "$1/sampler.pid"
            while true; do
              echo "# $(date +%s)"
              docker stats --no-stream --format "{{.Name}} {{.MemUsage}}"
              sleep 2
            done
          ' sampler "$RUNNER_TEMP/resources" > "$RUNNER_TEMP/resources/stats.log" 2>&1 < /dev/null &
      - name: Smoke test through nginx (demo login → application → approved)
        run: python3 scripts/smoke.py http://localhost:8080 --timeout 180
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install newman and Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Request collection end to end (newman)
        working-directory: e2e
        run: npm run api -- --env-var base_url=http://localhost:8080
      - name: Demo personas from README in the browser (Playwright)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_MOCKS_URL: http://localhost:8001
        run: npm run ui
      - name: Resources after the full run (peak memory, image sizes, disk)
        if: always()
        continue-on-error: true
        run: |
          dir="$RUNNER_TEMP/resources"
          mkdir -p "$dir"
          if [ -f "$dir/sampler.pid" ]; then kill "$(cat "$dir/sampler.pid")" 2>/dev/null || true; fi
          python3 scripts/resource_report.py --samples "$dir/stats.log" --out "$dir/resources.md" || echo "Resource report is not available"
          if [ -f "$dir/resources.md" ]; then cat "$dir/resources.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload resources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resources
          path: |
            ${{ runner.temp }}/resources/resources.md
            ${{ runner.temp }}/resources/stats.log
          if-no-files-found: warn
          retention-days: 30
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop and remove volumes
        if: always()
        run: docker compose down -v
