name: ML reproducibility

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-ml.txt
      - run: pip install -r requirements-dev.txt -r requirements-ml.txt
      - name: Reproduce model, evaluate holdout and check sklearn-serving parity
        run: python -m pytest -q ml_tests
      - name: Test inference, feature validation and API access control
        run: python -m pytest -q tests/test_ml.py
